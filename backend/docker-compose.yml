version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: aura-db
    restart: always
    environment:
      POSTGRES_USER: aura_admin
      POSTGRES_PASSWORD: aura_secure_dev_pass
      POSTGRES_DB: aura_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aura_admin -d aura_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aura-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aura-web
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql+asyncpg://aura_admin:aura_secure_dev_pass@db:5432/aura_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=aura_super_secret_signing_key_change_me_in_prod
      - UPLOAD_DIR=/app/data/uploads
      - DUCKDB_PATH=/app/data/duckdb/aura_analytics.db
    ports:
      - "8000:8000"
    volumes:
      - upload_data:/app/data

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aura-worker
    command: celery -A app.infrastructure.tasks.worker worker --loglevel=info
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql+asyncpg://aura_admin:aura_secure_dev_pass@db:5432/aura_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=aura_super_secret_signing_key_change_me_in_prod
      - UPLOAD_DIR=/app/data/uploads
      - DUCKDB_PATH=/app/data/duckdb/aura_analytics.db
    volumes:
      - upload_data:/app/data

volumes:
  pgdata:
  redisdata:
  upload_data:
